# Connection settings per broker (no credentials - those are in accounts.properties).

# Zerodha - Kite Connect v3. Logins expire every day at token-expiry-time.
kite.api-url=https://api.kite.trade
kite.login-url=https://kite.zerodha.com/connect/login
kite.token-expiry-time=06:00
kite.zone=Asia/Kolkata

# Angel One - SmartAPI. Logs in automatically with TOTP; a new login is made after token-expiry-time
# (or sooner, whenever Angel says the token is no longer valid).
angelone.api-url=https://apiconnect.angelone.in
angelone.token-expiry-time=00:00
angelone.zone=Asia/Kolkata
# Sent with every request. Empty = detect automatically. Put your registered static IP in public-ip.
angelone.local-ip=
angelone.public-ip=
angelone.mac-address=
