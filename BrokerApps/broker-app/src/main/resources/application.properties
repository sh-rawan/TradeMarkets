# Broker app - all accounts of all brokers. Settings are split by type into the files imported below.
spring.application.name=broker-app
spring.config.import=classpath:database.properties,classpath:brokers.properties,classpath:sync.properties,\
  classpath:trading.properties,classpath:logging.properties,\
  optional:classpath:secrets.properties,optional:classpath:accounts.properties

server.port=8091
# Only this computer can call the API (it can place orders and has no login of its own).
server.address=127.0.0.1
