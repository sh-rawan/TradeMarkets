# Periodic fetch of funds, holdings, positions and orders into the DB.
sync.enabled=true
sync.zone=Asia/Kolkata
# Every 15 minutes from 09:00 to 15:45, Monday to Friday (second minute hour day month weekday).
sync.cron=0 */15 9-15 * * MON-FRI
# Also sync once when the app starts.
sync.on-startup=true

# Funds/holdings/positions snapshots older than this are deleted daily at cleanup-cron. Orders are kept.
sync.retention-days=90
sync.cleanup-cron=0 30 18 * * *
