# PostgreSQL, shared by all broker apps. Password is in secrets.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/trademarkets
spring.datasource.username=postgres

# Tables come from Flyway (broker-common/src/main/resources/db/migration); Hibernate only checks them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
