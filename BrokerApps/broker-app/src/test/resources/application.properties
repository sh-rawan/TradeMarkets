# Test config: real broker URLs, in-memory H2 (PostgreSQL mode), no scheduled syncs, one account per broker.
spring.application.name=broker-app
spring.config.import=classpath:brokers.properties,classpath:trading.properties

spring.datasource.url=jdbc:h2:mem:brokerapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
