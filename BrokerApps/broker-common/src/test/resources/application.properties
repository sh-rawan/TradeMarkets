# Test config: in-memory H2 (PostgreSQL mode), no scheduled syncs, fake brokers FAKE and AUTO (test classes).
spring.datasource.url=jdbc:h2:mem:broker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

sync.enabled=false
sync.retention-days=90

trading.enabled=true
trading.max-order-value=100000

app.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# main: fixed token. second: has to log in. auto: logs in by itself. off: disabled.
accounts.main.broker=FAKE
accounts.main.api-key=key-main
accounts.main.access-token=token-main
accounts.second.broker=fake
accounts.second.api-key=key-second
accounts.auto.broker=AUTO
accounts.auto.api-key=key-auto
accounts.off.broker=FAKE
accounts.off.enabled=false
