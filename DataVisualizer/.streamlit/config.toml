# Palette slot 1 (blue) instead of Streamlit's default red, which reads as an error state.
# Per-mode sections keep the app following the system light/dark setting.
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
