# Core application settings.
# Other settings live in separate files by type:
#   viber.properties    - Viber bot behaviour (API URL, bot name, reply text)
#   logging.properties  - log folder, retention, file size
#   secrets.properties  - token and webhook URL (git-ignored; copy secrets.properties.example)
spring.application.name=viber-bot
spring.config.import=classpath:viber.properties,classpath:logging.properties,optional:classpath:secrets.properties

server.port=8080
