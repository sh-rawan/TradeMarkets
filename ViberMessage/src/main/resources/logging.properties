# Log file settings (used by logback-spring.xml).

# Root folder for log files. Absolute so it works however the bot is started (VS Code Run button, terminal, jar).
# Sub-folders per category: application, messages, events, errors.
log.dir=C:/Users/agraw/OneDrive/Desktop/TradeMarkets/logFiles/viberBot

# Log files older than this many days are deleted automatically (checked at startup and at each daily rollover).
log.max-history=7

# A log file is rolled over when it reaches this size (and at least once a day).
log.max-file-size=10MB
