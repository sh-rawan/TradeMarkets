# Test config - replaces src/main/resources/application.properties during tests.
# Uses the real viber.properties (bot name, reply text, API URL) so tests follow whatever is configured,
# but never loads secrets.properties: tests use a fake token and never register a webhook.
spring.application.name=viber-bot
spring.config.import=classpath:viber.properties
viber.auth-token=test-token
viber.webhook-url=
